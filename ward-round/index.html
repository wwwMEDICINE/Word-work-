<title>Ward Round Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: sticky ward header + one row per bed, read left→right like a paper round sheet (bed · patient/Dx · problems · ward work · D/C · consult); rows fold into cards on phones. */
:root {
  --bg: #eef3f4; --surface: #ffffff; --surface-2: #f6f9f9; --ink: #10232b; --muted: #5a6e76; --line: #d6e0e3;
  --accent: #0b6e74; --accent-ink: #ffffff; --accent-soft: #d9eeee;
  --ok: #1d7446; --ok-soft: #ddf1e5; --warn: #8f5a00; --warn-soft: #faedd2;
  --crit: #b3261e; --crit-soft: #fbe1de; --info: #2b5797; --info-soft: #e0e9f6; --done: #66767c; --done-soft: #e6ebed;
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1518; --surface: #121f24; --surface-2: #0f1a1e; --ink: #e2ecee; --muted: #92a6ad; --line: #24363c;
  --accent: #52bcc2; --accent-ink: #052023; --accent-soft: #133237;
  --ok: #72cf98; --ok-soft: #142f1f; --warn: #e9b252; --warn-soft: #33270e; --crit: #f28b81; --crit-soft: #3b1714;
  --info: #92b4ee; --info-soft: #172640; --done: #9aa9ae; --done-soft: #1d292d; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0c1518; --surface: #121f24; --surface-2: #0f1a1e; --ink: #e2ecee; --muted: #92a6ad; --line: #24363c;
  --accent: #52bcc2; --accent-ink: #052023; --accent-soft: #133237;
  --ok: #72cf98; --ok-soft: #142f1f; --warn: #e9b252; --warn-soft: #33270e; --crit: #f28b81; --crit-soft: #3b1714;
  --info: #92b4ee; --info-soft: #172640; --done: #9aa9ae; --done-soft: #1d292d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#ward-name { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.2; border: 0; background: transparent; padding: 0; width: 100%; min-width: 0; border-bottom: 1px dashed transparent; }
#ward-name::placeholder { color: var(--muted); font-weight: 600; }
#ward-name:hover:not([readonly]), #ward-name:focus { border-bottom-color: var(--line); outline: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--crit); border-color: var(--crit); background: var(--crit-soft); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
.sync.on::before { background: var(--ok); } .sync.local::before { background: var(--warn); } .sync.ro::before { background: var(--info); }

/* summary strip */
.strip { display: flex; flex-wrap: wrap; gap: 8px 22px; padding-block: 14px 6px; align-items: baseline; }
.stat { display: flex; align-items: baseline; gap: 6px; color: var(--muted); }
.stat b { font-family: var(--f-mono); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat.warn b { color: var(--warn); } .stat.ok b { color: var(--ok); } .stat.crit b { color: var(--crit); }
.privacy { font-size: 12px; color: var(--muted); padding-block: 0 8px; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 8px 12px; }
.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
#q { flex: 1 1 200px; min-width: 0; max-width: 340px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.fchip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 10px; margin-bottom: 12px; }
.confirm p { margin: 0; flex: 1 1 260px; }

/* board */
.grid-cols { display: grid; grid-template-columns: 84px minmax(150px, 1.1fr) minmax(170px, 1.2fr) minmax(200px, 1.4fr) 158px minmax(140px, 1fr) 64px; gap: 0 14px; }
.colhead { padding: 0 12px 6px 16px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.board { display: flex; flex-direction: column; gap: 8px; padding-bottom: 40px; }
.pt { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 12px 16px; position: relative; align-items: start; }
.pt::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 3px 3px 0; background: var(--tone); }
.pt > div { min-width: 0; }
.tone-crit { --tone: var(--crit); --tone-soft: var(--crit-soft); } .tone-warn { --tone: var(--warn); --tone-soft: var(--warn-soft); }
.tone-ok { --tone: var(--ok); --tone-soft: var(--ok-soft); } .tone-info { --tone: var(--info); --tone-soft: var(--info-soft); }
.tone-done { --tone: var(--done); --tone-soft: var(--done-soft); }
.pt.tone-done { opacity: .72; }
.bed { font-family: var(--f-mono); font-weight: 600; font-size: 24px; line-height: 1.1; display: block; overflow-wrap: anywhere; }
.ex { display: inline-block; margin-top: 4px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 0 4px; }
.pt-name { font-weight: 600; }
.meta { color: var(--muted); font-size: 12px; }
.dx { margin-top: 2px; font-weight: 500; color: var(--accent); overflow-wrap: anywhere; }
.lbl { display: none; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.lbl b { font-family: var(--f-mono); color: var(--ink); }
ol.prob { margin: 0; padding: 0; list-style: none; counter-reset: p; }
ol.prob li { counter-increment: p; display: flex; gap: 6px; overflow-wrap: anywhere; }
ol.prob li::before { content: "#" counter(p); font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 1px; flex: none; }
ul.ww { margin: 0 0 4px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
ul.ww label { display: flex; gap: 7px; align-items: flex-start; cursor: pointer; overflow-wrap: anywhere; }
ul.ww input { margin-top: 4px; accent-color: var(--accent); flex: none; }
ul.ww input:checked + span { text-decoration: line-through; color: var(--muted); }
.ww-add { width: 100%; border: 1px dashed var(--line); background: transparent; border-radius: 6px; padding: 3px 8px; font-size: 13px; }
.ww-add:focus { border-style: solid; border-color: var(--accent); outline: none; }
.dcsel { width: 100%; border: 1px solid var(--tone); background: var(--tone-soft); color: var(--ink); border-radius: 8px; padding: 5px 6px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 12px; background: var(--tone-soft); color: var(--tone); border: 1px solid transparent; font-weight: 500; }
.chip .d { color: var(--ink); font-weight: 600; }
.stat-chip { font-family: var(--f-mono); font-size: 10px; letter-spacing: .04em; background: var(--crit); color: var(--surface); border-radius: 4px; padding: 0 4px; }
.c-ed { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.upd { font-size: 11px; color: var(--muted); text-align: right; overflow-wrap: anywhere; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; max-width: 640px; }
.empty h2 { font-family: var(--f-display); margin: 0; font-size: 20px; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); max-width: 60ch; }

/* consult panel */
.cpanel { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; padding-bottom: 40px; }
.dept { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.dept h3 { margin: 0; padding: 10px 14px; font-family: var(--f-display); font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dept h3 span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 500; }
.citem { display: grid; grid-template-columns: 52px 1fr; gap: 4px 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.citem:first-of-type { border-top: 0; }
.citem .bed { font-size: 17px; }
.citem select { border: 1px solid var(--tone); background: var(--tone-soft); border-radius: 6px; padding: 2px 4px; font-size: 12px; }
.crow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: rgb(5 15 18 / .5); }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 26px); }
.dlg-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dlg-h h2 { margin: 0; font-family: var(--f-display); font-size: 18px; }
.dlg-b { padding: 16px 18px; overflow-y: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.dlg-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.dlg-f .r { display: flex; gap: 8px; margin-left: auto; }
.fld { display: flex; flex-direction: column; gap: 3px; grid-column: span 6; min-width: 0; }
.fld.s1 { grid-column: span 1; } .fld.s2 { grid-column: span 2; } .fld.s3 { grid-column: span 3; }
.fld label, .fld .lab { font-size: 12px; color: var(--muted); font-weight: 500; }
.fld input, .fld select, .fld textarea, .csr input, .csr select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 6px 9px; width: 100%; min-width: 0; }
.fld textarea { resize: vertical; min-height: 78px; line-height: 1.5; }
.hint { font-size: 11px; color: var(--muted); }
.csr { display: grid; grid-template-columns: 1.1fr 1.6fr 1.1fr auto auto; gap: 6px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
.csr .note { grid-column: 1 / -1; }
.csr .urg { display: flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
.x { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; }
#sum-text { width: 100%; min-height: 50vh; font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: calc(100vw - 32px); }

@media (max-width: 1080px) {
  .colhead { display: none; }
  .grid-cols { grid-template-columns: 64px 1fr 1fr; gap: 10px 14px; }
  .pt .c-pt { grid-column: 2 / 3; } .pt .c-ed { grid-column: 3; grid-row: 1; }
  .pt .c-prob, .pt .c-ww { grid-column: 2 / -1; }
  .pt .c-dc { grid-column: 2 / 3; } .pt .c-cs { grid-column: 3 / -1; }
  .pt .c-bed { grid-row: 1 / span 4; }
  .lbl { display: block; }
}
@media (max-width: 560px) {
  .grid-cols { grid-template-columns: 1fr auto; }
  .pt .c-bed { grid-row: auto; grid-column: 1; display: flex; gap: 8px; align-items: baseline; }
  .pt .c-ed { grid-column: 2; grid-row: 1; flex-direction: row; align-items: center; }
  .pt .c-pt, .pt .c-prob, .pt .c-ww, .pt .c-dc, .pt .c-cs { grid-column: 1 / -1; }
  .upd { display: none; }
  .fld.s1, .fld.s2, .fld.s3 { grid-column: span 3; }
  .csr { grid-template-columns: 1fr 1fr; }
  .csr .reason { grid-column: 1 / -1; }
  #ward-name { font-size: 19px; }
}
@media (prefers-reduced-motion: no-preference) { .pt { transition: border-color .15s; } .pt:hover { border-color: var(--accent); } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="eyebrow" id="today">Ward round</span>
      <input id="ward-name" value="" placeholder="ตั้งชื่อวอร์ด เช่น อายุรกรรมชาย 1" aria-label="ชื่อหอผู้ป่วย" maxlength="80">
    </div>
    <span class="sync" id="sync">กำลังเชื่อมต่อ…</span>
    <div class="actions">
      <button class="btn primary" id="btn-add">+ เพิ่มผู้ป่วย</button>
      <button class="btn" id="btn-sum">สรุปส่งเวร / LINE</button>
      <button class="btn ghost" id="btn-new">เริ่มราวน์วันใหม่</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="strip" id="strip"></div>
  <p class="privacy">ข้อมูลนี้แชร์กับทุกคนที่เปิดลิงก์ ใช้เลขเตียงและชื่อย่อ (เช่น นาย ก.) แทนชื่อเต็ม HN หรือเลขบัตรประชาชน</p>
  <div id="confirm-slot"></div>
  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-pts" aria-selected="true">ผู้ป่วย</button>
      <button role="tab" id="tab-cs" aria-selected="false">Consult panel</button>
    </div>
    <input id="q" type="search" placeholder="ค้นหาเตียง ชื่อย่อ Dx…" aria-label="ค้นหา">
    <div class="filters" id="filters"></div>
  </div>
  <section id="view"></section>
</main>

<dialog id="dlg"><form class="dlg" id="pform" method="dialog"></form></dialog>
<dialog id="sdlg">
  <div class="dlg">
    <div class="dlg-h"><h2>สรุปราวน์ (คัดลอกไปวางใน LINE / ส่งเวร)</h2><button class="x" id="sum-close" aria-label="ปิด">×</button></div>
    <div style="padding:14px 18px"><textarea id="sum-text" readonly></textarea></div>
    <div class="dlg-f"><span class="hint">ถ้าปุ่มคัดลอกใช้ไม่ได้ ให้กดค้างที่ข้อความแล้วเลือกคัดลอก</span><div class="r"><button class="btn primary" id="sum-copy">คัดลอก</button></div></div>
  </div>
</dialog>
<datalist id="depts">
  <option value="Med"><option value="Surgery"><option value="Ortho"><option value="Neuro"><option value="Neurosurg"><option value="Cardio">
  <option value="Nephro"><option value="ID"><option value="GI"><option value="Chest"><option value="Endo"><option value="Hemato">
  <option value="Onco"><option value="Psych"><option value="Rehab"><option value="ENT"><option value="Eye"><option value="OB-GYN">
  <option value="Ped"><option value="Uro"><option value="CVT"><option value="Palliative"><option value="Nutrition"><option value="Social worker"><option value="Pharmacy">
</datalist>

<script>
(() => {
"use strict";
const DC = {
  watch:  { label: "Unstable / เฝ้าระวัง", short: "Unstable", tone: "crit" },
  active: { label: "ยังไม่พร้อม D/C", short: "Not ready", tone: "info" },
  plan:   { label: "วางแผน D/C", short: "Plan D/C", tone: "warn" },
  ready:  { label: "พร้อม D/C วันนี้", short: "Ready", tone: "ok" },
  done:   { label: "D/C แล้ว", short: "D/C'd", tone: "done" },
};
const CS = {
  todo: { label: "ยังไม่ได้ส่ง", tone: "crit" },
  sent: { label: "ส่งแล้ว รอดู", tone: "warn" },
  seen: { label: "ดูแล้ว / F/U", tone: "info" },
  off:  { label: "Sign off", tone: "done" },
};
const LS_KEY = "ward-round-board-v1";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = (o) => JSON.parse(JSON.stringify(o));
const thDate = (d) => new Date(d).toLocaleDateString("th-TH", { day: "numeric", month: "short" });
const natural = (a, b) => String(a.bed || "").localeCompare(String(b.bed || ""), "th", { numeric: true });

let mode = "connecting", db = null, userApi = null, me = null, readOnly = false;
let patients = new Map(), wardName = "";
const names = new Map();
const ui = { tab: "pts", q: "", dc: "all", csActive: true, confirm: false };
let local = { patients: {}, meta: {} };

$("#today").textContent = "Ward round · " + new Date().toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

/* ---------- storage ---------- */
function lsLoad() { try { const v = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (v && v.patients) local = v; } catch (e) {} }
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(local)); } catch (e) {} }
function useLocal(reason) {
  mode = "local"; lsLoad();
  patients = new Map(Object.entries(local.patients).map(([id, d]) => [id, { id, ...d }]));
  if (local.meta.name) { wardName = local.meta.name; $("#ward-name").value = wardName; }
  setSync("local", reason || "เก็บในเครื่องนี้เท่านั้น (ไม่ได้แชร์)");
  render();
}
const queues = {};
function enqueue(id, fn) { const p = (queues[id] || Promise.resolve()).then(fn, fn); queues[id] = p.catch(() => {}); return p; }
function onWriteErr(e) {
  const code = e && e.code;
  if (code === "invalid_argument" && !readOnly) { readOnly = true; setSync("ro", "อ่านอย่างเดียว"); render(); toast("บัญชีนี้แก้ไขข้อมูลไม่ได้ ขอสิทธิ์ Contributor จากเจ้าของลิงก์"); return; }
  if (code === "quota_exceeded") { toast("พื้นที่เก็บข้อมูลเต็ม ลบผู้ป่วยที่ D/C แล้วออกก่อน"); return; }
  toast("บันทึกไม่สำเร็จ ลองอีกครั้ง");
}
function stamp(d) { d.updatedAt = new Date().toISOString(); d.updatedBy = me || null; return d; }
function putPatient(id, data) {
  stamp(data);
  if (mode === "db") return enqueue(id, () => db.collection("patients").doc(id).set(data)).catch(onWriteErr);
  local.patients[id] = data; lsSave(); patients.set(id, { id, ...data }); render();
}
function patchPatient(id, patch) {
  stamp(patch);
  if (mode === "db") return enqueue(id, () => db.collection("patients").doc(id).update(patch)).catch(onWriteErr);
  local.patients[id] = { ...local.patients[id], ...patch }; lsSave(); patients.set(id, { id, ...local.patients[id] }); render();
}
function removePatient(id) {
  if (mode === "db") return enqueue(id, () => db.collection("patients").doc(id).delete()).catch(onWriteErr);
  delete local.patients[id]; lsSave(); patients.delete(id); render();
}
function saveWardName(name) {
  wardName = name;
  if (mode === "db") return enqueue("meta", () => db.doc("meta/ward").set({ name })).catch(onWriteErr);
  local.meta.name = name; lsSave();
}

async function connect() {
  if (!window.claude || typeof window.claude.use !== "function") { useLocal(); return; }
  const [d, u] = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("user").catch(() => null)]);
  userApi = u;
  if (!d) { useLocal("เก็บในเครื่องนี้เท่านั้น (ไม่ได้แชร์ / ยังไม่ได้ลงชื่อเข้าใช้)"); return; }
  db = d; mode = "db";
  if (u) {
    try { me = await u.id(); } catch (e) {}
    try { const w = await u.can("data.write"); if (w === false) readOnly = true; } catch (e) {}
  }
  setSync(readOnly ? "ro" : "on", readOnly ? "อ่านอย่างเดียว" : "ออนไลน์ · แชร์กับทีม");
  db.collection("patients").onSnapshot((snap) => {
    patients = new Map(snap.docs.map((s) => [s.id, { id: s.id, ...clone(s.data()) }]));
    resolveNames(); render();
  }, () => { setSync("", "การเชื่อมต่อหลุด รีเฟรชหน้า"); });
  db.doc("meta/ward").onSnapshot((s) => {
    const n = s.exists && s.data().name;
    if (n && document.activeElement !== $("#ward-name")) { wardName = n; $("#ward-name").value = n; }
  }, () => {});
}
async function resolveNames() {
  if (!userApi || typeof userApi.profiles !== "function") return;
  const ids = [...new Set([...patients.values()].map((p) => p.updatedBy).filter((x) => x && !names.has(x)))];
  if (!ids.length) return;
  try { const ps = await userApi.profiles(ids); ids.forEach((id) => names.set(id, (ps[id] && ps[id].name) || "")); render(); } catch (e) {}
}
function setSync(cls, text) { const el = $("#sync"); el.className = "sync " + cls; el.textContent = text; }
let toastT;
function toast(msg) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3200); }

/* ---------- render ---------- */
function list() { return [...patients.values()].sort(natural); }
function dayOf(admit) { if (!admit) return ""; const d = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(admit + "T00:00").getTime()) / 864e5) + 1; return d > 0 ? "D" + d : ""; }
function matches(p) {
  if (ui.dc !== "all" && (p.dc || "active") !== ui.dc) return false;
  if (!ui.q) return true;
  const hay = [p.bed, p.name, p.dx, ...(p.problems || []), ...(p.consults || []).map((c) => c.dept)].join(" ").toLowerCase();
  return hay.includes(ui.q.toLowerCase());
}

function renderStrip() {
  const ps = list().filter((p) => p.dc !== "done");
  const ww = ps.reduce((n, p) => n + (p.wardwork || []).filter((w) => !w.done).length, 0);
  const ready = ps.filter((p) => p.dc === "ready").length;
  const watch = ps.filter((p) => p.dc === "watch").length;
  const cs = ps.reduce((n, p) => n + (p.consults || []).filter((c) => c.status === "todo" || c.status === "sent").length, 0);
  $("#strip").innerHTML =
    `<span class="stat"><b>${ps.length}</b> ผู้ป่วยในวอร์ด</span>` +
    `<span class="stat ${watch ? "crit" : ""}"><b>${watch}</b> Unstable</span>` +
    `<span class="stat ${ww ? "warn" : ""}"><b>${ww}</b> ward work ค้าง</span>` +
    `<span class="stat ${ready ? "ok" : ""}"><b>${ready}</b> พร้อม D/C</span>` +
    `<span class="stat ${cs ? "warn" : ""}"><b>${cs}</b> consult รอ</span>`;
}
function renderFilters() {
  const el = $("#filters");
  if (ui.tab === "cs") {
    el.innerHTML = `<button class="fchip" data-csact="1" aria-pressed="${ui.csActive}">เฉพาะที่ยังไม่ sign off</button>`;
    return;
  }
  const opts = [["all", "ทั้งหมด"], ...Object.entries(DC).map(([k, v]) => [k, v.short])];
  el.innerHTML = opts.map(([k, l]) => `<button class="fchip" data-dcf="${k}" aria-pressed="${ui.dc === k}">${esc(l)}</button>`).join("");
}
function updatedLine(p) {
  if (!p.updatedAt) return "";
  const t = new Date(p.updatedAt);
  const sameDay = t.toDateString() === new Date().toDateString();
  const when = sameDay ? t.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) : thDate(t);
  const who = p.updatedBy && names.get(p.updatedBy);
  return `อัปเดต ${esc(when)}${who ? "<br>" + esc(who) : ""}`;
}

  const wwl = ww.map((w) => `<li><label><input type="checkbox" id="ww-${p.id}-${w.id}" data-act="ww" data-w="${w.id}" ${w.done ? "checked" : ""} ${dis}><span>${esc(w.t)}</span></label></li>`).join("");
  const cs = (p.consults || []).map((c) => { const s = CS[c.status] || CS.todo; return `<span class="chip tone-${s.tone}" title="${esc(c.reason || "")}"><span class="d">${esc(c.dept)}</span>${esc(s.label)}${c.urgent ? ' <span class="stat-chip">STAT</span>' : ""}</span>`; }).join("");
  const age = [p.age ? p.age + " ปี" : "", p.sex || ""].filter(Boolean).join(" ");
  const adm = p.admit ? `Adm ${thDate(p.admit + "T00:00")} · ${dayOf(p.admit)}` : "";
  const dcMeta = [p.dcDate ? "คาด D/C " + thDate(p.dcDate + "T00:00") : "", p.dcNote || ""].filter(Boolean).map(esc).join(" · ");
  return `<article class="pt grid-cols tone-${dc.tone}" data-id="${p.id}">
    <div class="c-bed"><span class="bed">${esc(p.bed || "—")}</span>${p.example ? '<span class="ex">ตัวอย่าง</span>' : ""}</div>
    <div class="c-pt"><div class="pt-name">${esc(p.name || "ไม่ระบุ")} <span class="meta">${esc(age)}</span></div><div class="dx">${esc(p.dx || "ยังไม่ใส่ Dx")}</div><div class="meta">${adm}</div></div>
    <div class="c-prob"><span class="lbl">Active problems</span>${probs}</div>
    <div class="c-ww"><span class="lbl">Ward work <b>${left}</b>/${ww.length} ค้าง</span><ul class="ww">${wwl}</ul>${readOnly ? "" : `<input class="ww-add" id="add-${p.id}" data-act="ww-add" placeholder="+ เพิ่ม ward work แล้วกด Enter" aria-label="เพิ่ม ward work เตียง ${esc(p.bed)}">`}</div>
    <div class="c-dc"><span class="lbl">Discharge</span><select class="dcsel" id="dc-${p.id}" data-act="dc" aria-label="สถานะ D/C เตียง ${esc(p.bed)}" ${dis}>${Object.entries(DC).map(([k, v]) => `<option value="${k}" ${k === dcKey ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select>${dcMeta ? `<div class="meta" style="margin-top:4px">${dcMeta}</div>` : ""}</div>
    <div class="c-cs"><span class="lbl">Consult</span><div class="chips">${cs || '<span class="meta">—</span>'}</div></div>
    <div class="c-ed"><button class="btn" data-act="edit" aria-label="แก้ไขเตียง ${esc(p.bed)}">${readOnly ? "ดู" : "แก้ไข"}</button><div class="upd">${updatedLine(p)}</div></div>
  </article>`;
}
function emptyHTML() {
  if (mode === "connecting") return `<div class="empty"><h2>กำลังโหลดรายชื่อผู้ป่วย…</h2><p>ถ้าค้างนาน ให้รีเฟรชหน้า</p></div>`;
  return `<div class="empty"><h2>ยังไม่มีผู้ป่วยในบอร์ดนี้</h2>
    <p>กด “เพิ่มผู้ป่วย” แล้วใส่เลขเตียง Dx active problems ward work สถานะ D/C และ consult ทุกคนในทีมที่เปิดลิงก์นี้จะเห็นและติ๊กงานได้พร้อมกัน</p>
    ${readOnly ? "" : `<div class="actions"><button class="btn primary" data-act="first-add">+ เพิ่มผู้ป่วยคนแรก</button><button class="btn" data-act="examples">ลองด้วยข้อมูลตัวอย่าง 4 เตียง</button></div>`}</div>`;
}
function renderPatients() {
  const ps = list().filter(matches);
  if (!patients.size) return emptyHTML();
  const head = `<div class="grid-cols colhead"><span>เตียง</span><span>ผู้ป่วย / Diagnosis</span><span>Active problems</span><span>Ward work</span><span>Discharge</span><span>Consult</span><span></span></div>`;
  const hasEx = list().some((p) => p.example) && !readOnly;
  const exBar = hasEx ? `<div class="confirm" style="border-color:var(--line);background:var(--surface)"><p>บอร์ดนี้มีข้อมูลตัวอย่าง (ป้าย “ตัวอย่าง”) ลบออกก่อนใช้งานจริง</p><button class="btn" data-act="clear-ex">ลบข้อมูลตัวอย่าง</button></div>` : "";
  return exBar + head + `<div class="board">${ps.map(rowHTML).join("") || '<p class="meta">ไม่พบผู้ป่วยที่ตรงกับตัวกรอง</p>'}</div>`;
}
function renderConsults() {
  const groups = new Map();
  list().forEach((p) => (p.consults || []).forEach((c) => {
    if (ui.csActive && c.status === "off") return;
    if (ui.q && ![p.bed, p.name, c.dept, c.reason].join(" ").toLowerCase().includes(ui.q.toLowerCase())) return;
    const k = (c.dept || "อื่นๆ").trim();
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push({ p, c });
  }));
  if (!groups.size) return `<div class="empty"><h2>${patients.size ? "ไม่มี consult ที่ค้างอยู่" : "ยังไม่มีผู้ป่วย"}</h2><p>เพิ่ม consult ได้ในหน้าแก้ไขผู้ป่วยแต่ละเตียง แล้วจะรวมมาแสดงตามแผนกที่นี่ ใช้ดูว่าต้องตามแผนกไหน เตียงไหนบ้าง</p></div>`;
  const order = { todo: 0, sent: 1, seen: 2, off: 3 };
  const dis = readOnly ? "disabled" : "";
  return `<div class="cpanel">${[...groups.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([dept, items]) => {
    items.sort((a, b) => (b.c.urgent ? 1 : 0) - (a.c.urgent ? 1 : 0) || order[a.c.status] - order[b.c.status] || natural(a.p, b.p));
    return `<section class="dept"><h3>${esc(dept)}<span>${items.length} ราย</span></h3>${items.map(({ p, c }) => {
      const s = CS[c.status] || CS.todo;
      return `<div class="citem tone-${s.tone}" data-id="${p.id}" data-c="${c.id}"><span class="bed">${esc(p.bed)}</span>
        <div style="min-width:0"><div class="crow"><b>${esc(p.name || "")}</b>${c.urgent ? '<span class="stat-chip">STAT</span>' : ""}
        <select id="cs-${p.id}-${c.id}" data-act="cs" aria-label="สถานะ consult" ${dis}>${Object.entries(CS).map(([k, v]) => `<option value="${k}" ${k === c.status ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select></div>
        <div>${esc(c.reason || "")}</div>${c.note ? `<div class="meta">${esc(c.note)}</div>` : ""}</div></div>`;
    }).join("")}</section>`;
  }).join("")}</div>`;
}
function renderConfirm() {
  $("#confirm-slot").innerHTML = ui.confirm ? `<div class="confirm"><p>เริ่มราวน์วันใหม่: ลบ ward work ที่ติ๊กเสร็จแล้ว และนำผู้ป่วยที่สถานะ “D/C แล้ว” ออกจากบอร์ด งานที่ยังค้างจะยังอยู่</p><button class="btn danger" data-act="newround-yes">ยืนยัน</button><button class="btn" data-act="newround-no">ยกเลิก</button></div>` : "";
}
function render() {
  const ae = document.activeElement, aid = ae && ae.id, aval = ae && ae.value, sel = ae && ae.selectionStart;
  renderStrip(); renderFilters(); renderConfirm();
  $("#tab-pts").setAttribute("aria-selected", ui.tab === "pts");
  $("#tab-cs").setAttribute("aria-selected", ui.tab === "cs");
  $("#view").innerHTML = ui.tab === "pts" ? renderPatients() : renderConsults();
  ["#btn-add", "#btn-new"].forEach((s) => ($(s).disabled = readOnly));
  $("#ward-name").readOnly = readOnly;

}

/* ---------- events ---------- */
const view = $("#view");
view.addEventListener("change", (e) => {
  const t = e.target, row = t.closest("[data-id]"); if (!row) return;
  const p = patients.get(row.dataset.id); if (!p) return;
  if (t.dataset.act === "ww") {
    const ww = clone(p.wardwork || []).map((w) => (w.id === t.dataset.w ? { ...w, done: t.checked } : w));
    patchPatient(p.id, { wardwork: ww });
  } else if (t.dataset.act === "dc") {
    patchPatient(p.id, { dc: t.value });
  } else if (t.dataset.act === "cs") {
    const cs = clone(p.consults || []).map((c) => (c.id === row.dataset.c ? { ...c, status: t.value } : c));
    patchPatient(p.id, { consults: cs });
  }
});
view.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t.dataset.act !== "ww-add" || e.key !== "Enter" || e.isComposing) return;
  e.preventDefault();
  const txt = t.value.trim(); if (!txt) return;
  const p = patients.get(t.closest("[data-id]").dataset.id); if (!p) return;
  t.value = "";
  patchPatient(p.id, { wardwork: [...clone(p.wardwork || []), { id: uid(), t: txt, done: false }] });
});
view.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "edit") openEditor(patients.get(b.closest("[data-id]").dataset.id));
  else if (act === "first-add") openEditor(null);
  else if (act === "examples") addExamples();
  else if (act === "clear-ex") list().filter((p) => p.example).forEach((p) => removePatient(p.id));
});
$("#confirm-slot").addEventListener("click", (e) => {
  const act = e.target.dataset.act;
  if (act === "newround-no") { ui.confirm = false; renderConfirm(); }
  if (act === "newround-yes") {
    ui.confirm = false;
    list().forEach((p) => {
      if (p.dc === "done") removePatient(p.id);
      else if ((p.wardwork || []).some((w) => w.done)) patchPatient(p.id, { wardwork: p.wardwork.filter((w) => !w.done) });
    });
    render(); toast("เริ่มราวน์วันใหม่แล้ว");
  }
});
$("#filters").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.dcf) ui.dc = b.dataset.dcf;
  if (b.dataset.csact) ui.csActive = !ui.csActive;
  render();
});
$("#tab-pts").onclick = () => { ui.tab = "pts"; render(); };
$("#tab-cs").onclick = () => { ui.tab = "cs"; render(); };
$("#q").addEventListener("input", (e) => { ui.q = e.target.value.trim(); render(); });
$("#btn-add").onclick = () => openEditor(null);
$("#btn-new").onclick = () => { ui.confirm = true; renderConfirm(); };
$("#ward-name").addEventListener("change", (e) => { const v = e.target.value.trim(); if (v && !readOnly) saveWardName(v); });
$("#btn-sum").onclick = () => { $("#sum-text").value = summaryText(); $("#sdlg").showModal(); };
$("#sum-close").onclick = () => $("#sdlg").close();
$("#sum-copy").onclick = () => {
  const ta = $("#sum-text");
  const fallback = () => { ta.focus(); ta.select(); toast("เลือกข้อความแล้ว กดคัดลอกจากเมนูของเครื่อง"); };
  try { navigator.clipboard.writeText(ta.value).then(() => toast("คัดลอกแล้ว"), fallback); } catch (e) { fallback(); }
};

form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (readOnly) return;
  const v = (id) => $(id).value.trim();
  if (!v("#f-bed")) { $("#f-bed").focus(); toast("ใส่เลขเตียงก่อนบันทึก"); return; }
  const old = editing ? patients.get(editing) : null;
  const oldWW = new Map((old && old.wardwork || []).map((w) => [w.t, w]));
  const wardwork = $("#f-ww").value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
    const done = /^(✓|\[x\])\s*/i.test(l), t = l.replace(/^(✓|\[x\])\s*/i, "");
    const prev = oldWW.get(t);
    return { id: prev ? prev.id : uid(), t, done };
  });
  const consults = [...form.querySelectorAll(".csr")].map((r) => ({
    id: r.dataset.cid, dept: r.querySelector(".dept-in").value.trim(), reason: r.querySelector(".reason").value.trim(),
    status: r.querySelector("select").value, urgent: r.querySelector(".urg input").checked, note: r.querySelector(".note").value.trim(),
  })).filter((c) => c.dept || c.reason);
  const data = {
    bed: v("#f-bed"), name: v("#f-name"), age: v("#f-age"), sex: $("#f-sex").value, admit: $("#f-admit").value, dx: v("#f-dx"),
    problems: $("#f-prob").value.split("\n").map((l) => l.replace(/^#?\d+[.)]?\s*/, "").trim()).filter(Boolean),
    wardwork, dc: $("#f-dc").value, dcDate: $("#f-dcdate").value, dcNote: v("#f-dcnote"), consults,
  };
  if (old && old.example) data.example = true;
  putPatient(editing || "p" + uid(), data);
  $("#dlg").close();
});

/* ---------- summary text ---------- */
function summaryText() {
  const lines = [`${wardName || $("#ward-name").value} — ราวน์ ${new Date().toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" })}`, ""];
  list().filter((p) => p.dc !== "done").forEach((p) => {
    lines.push(`เตียง ${p.bed} | ${p.name || ""} ${p.age || ""}${p.sex || ""}${p.admit ? " | " + dayOf(p.admit) : ""}`.trim());
    lines.push(`Dx: ${p.dx || "-"}`);
    (p.problems || []).forEach((x, i) => lines.push(`  #${i + 1} ${x}`));
    const ww = (p.wardwork || []);
    if (ww.length) { lines.push("Ward work:"); ww.forEach((w) => lines.push(`  [${w.done ? "x" : " "}] ${w.t}`)); }
    lines.push(`D/C: ${(DC[p.dc] || DC.active).label}${p.dcDate ? " (คาด " + thDate(p.dcDate + "T00:00") + ")" : ""}${p.dcNote ? " – " + p.dcNote : ""}`);
    const cs = (p.consults || []).filter((c) => c.status !== "off");
    if (cs.length) lines.push("Consult: " + cs.map((c) => `${c.dept}${c.urgent ? " STAT" : ""} (${(CS[c.status] || CS.todo).label})`).join(", "));
    lines.push("");
  });
  return lines.join("\n");
}
